<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{TITLE}</title>
<meta name="description" content="{DESC}" />
<!-- GO-LIVE: update domain across canonical/OG/JSON-LD when the club's real domain points here -->
<link rel="canonical" href="{CANON}" />
<meta name="robots" content="index, follow, max-image-preview:large" />
<meta name="theme-color" content="#0d0b09" />
<meta name="geo.region" content="US-IL" />
<meta name="geo.placename" content="Sandwich, Illinois" />

<!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:url" content="{CANON}" />
<meta property="og:title" content="{OG_TITLE}" />
<meta property="og:description" content="{OG_DESC}" />
<meta property="og:image" content="{BASE_URL}/img/og-image.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Sandwich Sports Boosters — Supporting Sandwich High School Athletics" />
<meta property="og:locale" content="en_US" />
<meta property="og:site_name" content="Sandwich Sports Boosters" />

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{OG_TITLE}" />
<meta name="twitter:description" content="{OG_DESC}" />
<meta name="twitter:image" content="{BASE_URL}/img/og-image.jpg" />

<link rel="icon" type="image/png" sizes="32x32" href="img/favicon.png" />
<link rel="icon" type="image/png" sizes="16x16" href="img/favicon.png" />
<link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SportsOrganization",
  "name": "Sandwich Sports Boosters",
  "alternateName": "Sandwich Sports Boosters Club",
  "description": "All-volunteer booster club supporting every sport and every student-athlete at Sandwich High School in Sandwich, Illinois — funding equipment, scholarships, sportsmanship awards, and community events.",
  "url": "{BASE_URL}/",
  "logo": "{BASE_URL}/img/logo.png",
  "image": "{BASE_URL}/img/og-image.jpg",
  "email": "sandwichsportsboosters@gmail.com",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Sandwich",
    "addressRegion": "IL",
    "addressCountry": "US"
  },
  "areaServed": {
    "@type": "City",
    "name": "Sandwich, Illinois"
  },
  "sameAs": [
    "https://www.facebook.com/sandwichsportsboosters",
    "https://www.instagram.com/sandwichsportsboosters"
  ]
}
</script>
